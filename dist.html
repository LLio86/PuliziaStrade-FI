<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misura distanza dal punto</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 50px; }
  button { padding: 10px 20px; font-size: 18px; }
  #distance { font-size: 24px; margin-top: 20px; }
</style>
</head>
<body>

<h1>Distanza dal punto fissato</h1>
<button id="setPointBtn">Fissa punto</button>
<div id="distance">Distanza: --- m</div>

<script>
let targetPoint = null;

// Funzione per fissare il punto
document.getElementById('setPointBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    alert("Geolocalizzazione non supportata dal tuo browser.");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {
    targetPoint = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude
    };
    alert(`Punto fissato: lat ${targetPoint.lat.toFixed(6)}, lon ${targetPoint.lon.toFixed(6)}`);
  }, err => {
    alert("Errore geolocalizzazione: " + err.message);
  });
});

// Funzione per calcolare distanza in metri tra due coordinate
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000; // raggio terrestre in metri
  const toRad = deg => deg * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2)**2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// Aggiorna distanza ogni secondo
setInterval(() => {
  if (!targetPoint) return;

  navigator.geolocation.getCurrentPosition(pos => {
    const dist = getDistance(
      targetPoint.lat, targetPoint.lon,
      pos.coords.latitude, pos.coords.longitude
    );
    document.getElementById('distance').textContent = `Distanza: ${dist.toFixed(2)} m`;
  });
}, 1000);

</script>
</body>
</html>
